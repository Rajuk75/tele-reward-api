<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Track Task & Reward Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen text-slate-800 pb-24 md:pb-12 antialiased select-none">

    <header id="appHeader" class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-sm"></header>

    <main class="max-w-md mx-auto px-4 pt-3.5 space-y-3.5">

        <div class="bg-white rounded-2xl p-4 border border-slate-200/90 shadow-sm">
            <h1 class="text-base font-black text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-emerald-600 text-sm"></i> Check Payout Status
            </h1>

            <form onsubmit="handleSearch(event)" class="mt-3.5 space-y-2.5">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="e.g. 9876543210@paytm or Account No" class="w-full text-xs font-bold px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 pr-20 transition placeholder:font-normal">
                    <button type="submit" class="absolute right-1.5 top-1 px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold hover:bg-emerald-700 transition cursor-pointer">
                        Search
                    </button>
                </div>
            </form>
        </div>

        <div id="resultsArea" class="space-y-3">
            <div id="initialPrompt" class="py-12 text-center text-slate-400">
                <i class="fa-solid fa-receipt text-3xl mb-2 text-slate-300"></i>
                <p class="text-xs font-medium">Search using your payout account above to see status.</p>
            </div>

            <div id="loadingPrompt" class="hidden py-10 text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-3 border-emerald-600 border-t-transparent"></div>
                <p class="mt-2 text-xs text-slate-500 font-medium">Searching records...</p>
            </div>

            <div id="noResults" class="hidden py-10 text-center bg-white rounded-2xl border border-slate-200 p-5">
                <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 mx-auto flex items-center justify-center text-lg mb-2">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <h4 class="text-sm font-bold text-slate-700">No Tasks Found</h4>
                <p class="text-xs text-slate-400 mt-0.5">We couldn't find any tasks linked to this account.</p>
            </div>

            <div id="taskList" class="space-y-3"></div>
        </div>

    </main>

    <nav id="appBottomNav" data-active-tab="track" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200/80 shadow-lg"></nav>

    <script>
        async function handleSearch(e) {
            if (e) e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                Swal.fire({ icon: 'info', title: 'Enter Account', text: 'Please enter your UPI ID or Account Number' });
                return;
            }

            document.getElementById('initialPrompt').classList.add('hidden');
            document.getElementById('noResults').classList.add('hidden');
            document.getElementById('taskList').innerHTML = '';
            document.getElementById('loadingPrompt').classList.remove('hidden');

            try {
                const res = await fetch(`/v1/public/tracking/status?query=${encodeURIComponent(query)}`);
                const json = await res.json();
                document.getElementById('loadingPrompt').classList.add('hidden');

                if (!res.ok || !json.data || json.data.length === 0) {
                    document.getElementById('noResults').classList.remove('hidden');
                    return;
                }

                renderTaskList(json.data);
            } catch (err) {
                document.getElementById('loadingPrompt').classList.add('hidden');
                Swal.fire({ icon: 'error', title: 'Error', text: err.message });
            }
        }

        function renderTaskList(tasks) {
            const container = document.getElementById('taskList');
            container.innerHTML = '';

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2.5';

                let badgeColor = 'bg-amber-50 text-amber-700 border-amber-200';
                let iconClass = 'fa-clock';

                if (task.statusBadge === 'success') {
                    badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                    iconClass = 'fa-circle-check';
                } else if (task.statusBadge === 'danger') {
                    badgeColor = 'bg-red-50 text-red-700 border-red-200';
                    iconClass = 'fa-circle-xmark';
                } else if (task.statusBadge === 'info') {
                    badgeColor = 'bg-blue-50 text-blue-700 border-blue-200';
                    iconClass = 'fa-circle-info';
                }

                const dateStr = task.createdAt ? new Date(task.createdAt).toLocaleString('en-IN', {
                    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                }) : '';

                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div>
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${task.category}</span>
                            <h3 class="text-sm font-bold text-slate-900 leading-tight">${task.offerName}</h3>
                        </div>
                        <span class="text-sm font-extrabold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg">
                            ₹${task.rewardAmount}${task.maxUserEarningPaise == null ? '' : ` / ₹${task.maxUserEarningPaise / 100}`}
                        </span>
                    </div>

                    <div class="p-2.5 rounded-xl border ${badgeColor} text-xs flex items-start gap-2">
                        <i class="fa-solid ${iconClass} mt-0.5"></i>
                        <div>
                            <span class="font-bold block">${task.status}</span>
                            <span class="text-[11px] opacity-90">${task.statusMessage}</span>
                        </div>
                    </div>

                    <div class="pt-1 flex items-center justify-between text-[11px] text-slate-400 border-t border-slate-100">
                        <span>A/C: <span class="font-mono font-medium text-slate-600">${task.payoutAccount}</span></span>
                        <span>${dateStr}</span>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedAccount = localStorage.getItem('last_payout_account');
            if (savedAccount) {
                document.getElementById('searchInput').value = savedAccount;
                handleSearch();
            }
        });
    </script>
    <script src="/js/app-navbar.js?v=2"></script>
</body>
</html>

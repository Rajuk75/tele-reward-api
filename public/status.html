<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Track Task &amp; Reward Status | adsHamper</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f8fafc; color: #0f172a; font: 14px/1.55 'Plus Jakarta Sans', system-ui, sans-serif; }
        main { max-width: 560px; margin: auto; padding: clamp(18px,4vw,44px) 16px 32px; }
        h1, h2, p, ol { margin: 0; }
        h1 { font-size: 22px; line-height: 1.3; letter-spacing: -.025em; }
        form, details { border: 1px solid #dce1e8; border-radius: 12px; background: white; }
        label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 600; }
        .search-row, footer, .steps li { display: flex; gap: 10px; }
        input, button { min-height: 44px; border-radius: 10px; font: inherit; }
        input { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid #aeb8c5; font-size: 16px; }
        button { padding: 8px 16px; border: 0; background: #0f172a; color: white; font-weight: 500; cursor: pointer; }
        button:hover { background: #25334b; }
        button:active { background: #101a2b; }
        :focus-visible { outline: 2px solid #694ea0; outline-offset: 2px; }
        #feedback { color: #475569; margin-top: 14px; }
        #feedback:empty { display: none; }
        details { margin-top: 12px; overflow-wrap: anywhere; }
        footer, .steps li { justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
        form, summary { padding: clamp(14px,3vw,20px); }
        summary { display: grid; grid-template-columns: 42px minmax(0,1fr) 16px; gap: 8px 10px; align-items: start; cursor: pointer; list-style: none; border-radius: 12px; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: ''; grid-area: 1 / 3; align-self: center; width: 8px; height: 8px; border: solid #596578; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
        details[open] summary::after { transform: rotate(225deg); }
        .summary-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
        .task-body { margin-inline: clamp(14px,3vw,20px); padding: 12px 0 16px; border-top: 1px solid #e2e8f0; }
        .logo { position: relative; display: grid; place-items: center; flex: none; width: 42px; height: 42px; overflow: hidden; border-radius: 10px; background: #f2eff8; color: #584482; font-size: 19px; font-weight: 700; }
        .logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: white; }
        .category { color: #665583; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
        .name { display: block; font-weight: 700; font-size: 17px; line-height: 1.4; }
        .amount { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .status { font-weight: 600; }
        .status::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: #8b6929; }
        .status[data-kind="success"]::before { background: #237554; }
        .status[data-kind="info"]::before { background: #695099; }
        .status[data-kind="danger"]::before { background: #a53237; }
        .message, footer, .steps { color: #475569; font-size: 13px; }
        .steps { margin-top: 10px; padding: 0; list-style: none; }
        .steps li { padding: 5px 0; gap: 2px 12px; }
        .steps li span:first-child { flex: 1 1 130px; }
        footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e2e8f0; gap: 4px 12px; }
    </style>
</head>
<body>
    <main>
        <form id="searchForm">
            <h1>Track task status</h1>
            <label for="searchInput">UPI ID, bank account number or click ID</label>
            <div class="search-row">
                <input id="searchInput" type="text" required autocapitalize="none" spellcheck="false" placeholder="Search identifier">
                <button type="submit">Search</button>
            </div>
        </form>
        <p id="feedback" role="status">Enter the details used for your task to see its progress.</p>
        <div id="taskList"></div>
        <template id="taskCard">
            <details>
                <summary>
                    <span class="logo" aria-hidden="true"></span>
                    <span><span class="category"></span><strong class="name"></strong></span>
                    <span class="summary-meta"><span class="status"></span><span class="amount"></span></span>
                </summary>
                <div class="task-body">
                    <p class="message"></p>
                    <ol class="steps" aria-label="Task milestones" hidden></ol>
                    <footer><span class="account"></span><time></time></footer>
                </div>
            </details>
        </template>
    </main>
    <script>
        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        const list = document.getElementById('taskList');
        const feedback = document.getElementById('feedback');
        const currency = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0, maximumFractionDigits: 2 });
        const dateFormat = new Intl.DateTimeFormat('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        let latestSearch = 0;

        function renderTask(task) {
            const card = document.getElementById('taskCard').content.cloneNode(true);
            const name = task.offerName || 'Special Task';
            card.querySelector('.name').textContent = name;
            card.querySelector('.category').textContent = task.category;
            const logo = card.querySelector('.logo');
            logo.textContent = Array.from(name.trim())[0] || '';
            if (task.icon) {
                const image = new Image();
                image.alt = '';
                image.addEventListener('error', () => image.remove(), { once: true });
                image.src = task.icon;
                logo.append(image);
            }

            const earned = task.earnedUserAmountPaise == null ? task.rewardAmount : task.earnedUserAmountPaise / 100;
            card.querySelector('.amount').textContent = task.maxUserEarningPaise == null
                ? currency.format(task.rewardAmount || 0)
                : currency.format(earned || 0) + ' / ' + currency.format(task.maxUserEarningPaise / 100);
            const status = card.querySelector('.status');
            status.textContent = task.status;
            status.dataset.kind = task.statusBadge;
            card.querySelector('.message').textContent = task.statusMessage;
            const steps = card.querySelector('.steps');
            for (const milestone of task.milestones || []) {
                const row = document.createElement('li');
                const label = document.createElement('span');
                label.textContent = milestone.eventName || milestone.eventKey;
                const detail = document.createElement('span');
                const state = String(milestone.status || '').replaceAll('_', ' ');
                detail.textContent = [state.charAt(0).toUpperCase() + state.slice(1), milestone.userSharePaise == null ? '' : currency.format(milestone.userSharePaise / 100)].filter(Boolean).join(' · ');
                row.append(label, detail);
                steps.append(row);
            }
            steps.hidden = !steps.childElementCount;
            card.querySelector('.account').textContent = task.payoutAccount ? 'A/C ' + task.payoutAccount : '';
            const date = new Date(task.createdAt);
            if (task.createdAt && Number.isFinite(date.getTime())) {
                const time = card.querySelector('time');
                time.dateTime = date.toISOString();
                time.textContent = dateFormat.format(date);
            }
            return card;
        }

        async function search() {
            const query = input.value.trim();
            if (!query) {
                input.value = '';
                input.reportValidity();
                return;
            }
            const request = ++latestSearch;
            list.replaceChildren();
            feedback.textContent = 'Searching records…';
            try {
                const response = await fetch('/v1/public/tracking/status?' + new URLSearchParams({ query }));
                const result = await response.json();
                if (request !== latestSearch) return;
                if (!response.ok || !Array.isArray(result.data)) throw new Error();
                list.replaceChildren(...result.data.map(renderTask));
                feedback.textContent = result.data.length ? '' : 'No tasks found for these details.';
            } catch {
                if (request === latestSearch) feedback.textContent = 'Unable to load task status. Please try again.';
            }
        }

        form.addEventListener('submit', event => { event.preventDefault(); search(); });
        const saved = localStorage.getItem('last_payout_account');
        if (saved) { input.value = saved; search(); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task reward | adsHamper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { background: #f3f5ef; color: #122b23; }
        #offerContent.hidden, [hidden] { display: none !important; }
        #appHeader > div, .task-shell { max-width: 980px; margin-inline: auto; }
        .task-shell { padding: clamp(18px, 4vw, 48px) 16px 96px; }
        .offer-layout { display: grid; gap: 16px; align-items: start; }
        .offer-layout > * { min-width: 0; }
        .ticket, .payout-card { border: 1px solid #d5dfd8; border-radius: 22px; overflow: hidden; background: white; }
        .ticket-cover { width: 100%; max-height: 150px; object-fit: cover; }
        .ticket-heading, .payout-card { padding: clamp(18px, 3vw, 30px); }
        .identity { display: flex; align-items: center; gap: 14px; }
        .monogram { width: 54px; height: 54px; flex: none; display: grid; place-items: center; position: relative;
            border-radius: 14px; background: #e8efdc; color: #32513b; font-weight: 800; font-size: 25px; overflow: hidden; }
        .monogram img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .category { font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #52705f; }
        .offer-title { font-size: clamp(22px, 3.6vw, 36px); font-weight: 800; line-height: 1.15; letter-spacing: -.045em; overflow-wrap: anywhere; }
        .offer-copy { margin-top: 10px; font-size: 14px; line-height: 1.6; color: #506357; overflow-wrap: anywhere; }
        .reward { position: relative; isolation: isolate; overflow: hidden; padding: 20px clamp(20px, 3vw, 32px);
            background: #103e32; color: white; border-top: 2px dashed #9db6a3; }
        .reward::after { content: ""; position: absolute; z-index: -1; width: 215px; height: 215px; right: -86px; top: -45px;
            border-radius: 50%; background: repeating-radial-gradient(circle, transparent 0 7px, #386551 8px 9px); }
        .reward-label { color: #d4e9d5; font-size: 13px; font-weight: 600; }
        .amount { font-size: clamp(44px, 7vw, 66px); letter-spacing: -.065em; line-height: 1.12; font-weight: 800; overflow-wrap: anywhere; }
        .bonus { display: flex; align-items: center; gap: 9px; padding: 12px clamp(20px, 3vw, 32px); background: #e6f1c9; font-size: 13px; font-weight: 700; }
        .offer-details { padding: 0 clamp(20px, 3vw, 32px); }
        .offer-details summary { padding: 14px 0; cursor: pointer; font-size: 14px; font-weight: 700; }
        .offer-details ol, .offer-details p { margin-bottom: 16px; font-size: 14px; line-height: 1.6; color: #506357; overflow-wrap: anywhere; }
        .offer-details ol { list-style: decimal; padding-left: 20px; }
        .payout-card h2 { font-size: 24px; line-height: 1.2; letter-spacing: -.04em; font-weight: 800; }
        #payoutMethodTabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 20px 0 16px; }
        #payoutMethodTabs button { min-height: 44px; }
        #payoutFormsContainer input { font-size: 16px; }
        #claimBtn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; margin-top: 18px;
            padding: 14px; background: #126443; color: white; font-size: 15px; font-weight: 700; border-radius: 12px; }
        #claimBtn:not(:disabled)::after { content: "\2192"; }
        #claimBtn:hover { background: #104e36; }
        #claimBtn:disabled { opacity: .7; cursor: wait; }
        :focus-visible { outline: 3px solid #258869; outline-offset: 3px; }
        @media (min-width: 768px) { .offer-layout { grid-template-columns: 1.15fr 1fr; gap: 24px; } }
    </style>
</head>

<body class="antialiased min-h-screen">

    <!-- ── TOP NAVIGATION ── -->
    <header id="appHeader" class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-sm"></header>

    <!-- ── MAIN CONTENT CONTAINER ── -->
    <main class="task-shell">

        <!-- ── STATE 1: LOADING SKELETON ── -->
        <div id="loadingState" role="status" class="py-24 text-center">
            <div
                class="inline-block animate-spin rounded-full h-9 w-9 border-[3px] border-emerald-600 border-t-transparent">
            </div>
            <p class="mt-3.5 text-xs font-bold text-slate-500 tracking-wide">Fetching Task Details...</p>
        </div>

        <!-- ── STATE 2: ERROR SCREEN ── -->
        <div id="errorState" role="alert"
            class="hidden py-14 text-center bg-white rounded-2xl border border-slate-200/90 p-6 shadow-sm mt-4">
            <div
                class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-500 mx-auto flex items-center justify-center text-xl mb-3 border border-rose-100">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>
            <h3 class="text-base font-extrabold text-slate-900" id="errorMessage">Task Currently Unavailable</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-xs mx-auto leading-relaxed font-medium">
                This offer may have reached its limit, expired, or is temporarily inactive.
            </p>
            <a href="/status"
                class="mt-5 inline-flex items-center gap-2 text-xs font-bold px-4 py-2.5 bg-slate-900 text-white rounded-xl shadow-sm hover:bg-slate-800 transition">
                <i class="fa-solid fa-magnifying-glass text-[11px]"></i> Check Earnings Status
            </a>
        </div>

        <div id="offerContent" class="offer-layout hidden">
            <article class="ticket" aria-labelledby="offerName">
                <img id="offerBanner" class="ticket-cover" alt="" hidden>
                <div class="ticket-heading">
                    <div class="identity">
                        <div class="monogram" aria-hidden="true">
                            <span id="offerInitial"></span>
                            <img id="offerIcon" alt="" hidden>
                        </div>
                        <div class="min-w-0">
                            <p id="offerCategory" class="category"></p>
                            <h1 id="offerName" class="offer-title"></h1>
                        </div>
                    </div>
                    <p id="offerHook" class="offer-copy" hidden></p>
                </div>
                <div class="reward">
                    <p class="reward-label">Task reward &middot; up to</p>
                    <p id="offerReward" class="amount"></p>
                </div>
                <div id="spinBonusStrip" class="bonus" hidden>
                    <i class="fa-solid fa-gift" aria-hidden="true"></i>
                    <span id="spinBonusText"></span>
                </div>
                <div class="offer-details">
                    <details id="stepsSection" open hidden>
                        <summary>How to earn this reward</summary>
                        <ol id="offerStepsContainer"></ol>
                    </details>
                    <details id="termsSection" open hidden>
                        <summary>Offer terms</summary>
                        <p id="offerTerms" class="whitespace-pre-line"></p>
                    </details>
                </div>
            </article>
            <section class="payout-card" aria-labelledby="payoutHeading">
                <h2 id="payoutHeading">Your payout details</h2>
                <p class="offer-copy">Choose where to receive your reward.</p>
                <div id="payoutMethodTabs" role="group" aria-label="Payout method"></div>
                <div id="payoutFormsContainer"></div>
                <button type="button" id="claimBtn" onclick="window.taskApp.handleStartTaskAndClaim()">Continue</button>
            </section>
        </div>

    </main>

    <!-- ── BOTTOM NAVIGATION (Mobile Only: md:hidden) ── -->
    <nav id="appBottomNav" data-active-tab="offer" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200/80 shadow-lg"></nav>

    <!-- ── MODULAR JAVASCRIPT BUNDLES ── -->
    <script src="/js/app-navbar.js?v=2"></script>
    <script src="/js/task-api.js"></script>
    <script src="/js/task-notifications.js"></script>
    <script src="/js/task-payment.js"></script>
    <script src="/js/task-spin-modal.js"></script>
    <script src="/js/task-ui.js"></script>
    <script src="/js/task-app.js"></script>
</body>

</html>
